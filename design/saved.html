<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corner Stone — Saved</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #29241F;
  --sidebar: #221D18;
  --sidebar-text: #C7BFAF;
  --sidebar-text-active: #F7F3EA;
  --paper: #F5F0E6;
  --surface: #FFFFFF;
  --cream: #EFE7D8;
  --cream-2: #E9E0CE;
  --tan: #CBB89A;
  --clay: #A67C52;
  --brown: #6D5B45;
  --forest: #557C5E;
  --forest-dark: #44614C;
  --border: #E4DDCC;
  --muted: #6F6656;
  --meta: #948A78;

  --font-display: "Playfair Display", Georgia, serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}
img { display: block; max-width: 100%; }
button { font-family: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--forest); outline-offset: 2px; }
ul, ol { margin: 0; padding: 0; }
[hidden] { display: none !important; }

/* ===== Shell ===== */
.app-shell { display: flex; min-height: 100vh; }

.app-sidebar {
  width: 200px; flex-shrink: 0; background: var(--sidebar); color: var(--sidebar-text);
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 22px 14px; position: sticky; top: 0; height: 100vh;
}
.sidebar-logo {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--font-display); font-size: 21px; font-weight: 600;
  letter-spacing: 0.5px; color: var(--sidebar-text-active); padding: 6px 10px 26px 10px;
}
.sidebar-logo svg { width: 15px; height: 15px; color: var(--tan); flex-shrink: 0; }
.sidebar-nav { display: flex; flex-direction: column; gap: 3px; }
.sidebar-nav a {
  display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 9px;
  color: var(--sidebar-text); font-size: 14px; font-weight: 500;
}
.sidebar-nav a svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-nav a:hover { color: var(--sidebar-text-active); background: rgba(247,243,234,0.06); }
.sidebar-nav a[aria-current="page"] { color: var(--sidebar-text-active); background: rgba(247,243,234,0.1); }

.app-main { flex: 1; min-width: 0; }
.app-content { padding: 40px 44px 72px 44px; }

/* ===== Header ===== */
.saved-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap;
}
.saved-header h1 {
  font-family: var(--font-display); font-size: 30px; font-weight: 600; color: var(--ink); margin: 0 0 6px 0;
}
.saved-header p { font-size: 14px; color: var(--muted); margin: 0; max-width: 440px; }

.header-search {
  display: flex; align-items: center; width: 260px; height: 42px;
  background: var(--cream); border: 1px solid var(--border); border-radius: 21px; padding: 0 16px;
  flex-shrink: 0; margin-top: 2px;
}
.header-search svg { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
.header-search input {
  border: none; background: transparent; outline: none;
  font-family: var(--font-body); font-size: 13.5px; color: var(--ink); margin-left: 9px; width: 100%;
}
.header-search input::placeholder { color: var(--meta); }

/* ===== Filter tabs ===== */
.source-tabs { margin-top: 26px; display: flex; gap: 9px; }
.source-tab {
  height: 40px; padding: 0 20px; border-radius: 20px; border: none;
  background: var(--cream-2); color: var(--ink); font-family: var(--font-body); font-size: 14px; font-weight: 500;
}
.source-tab:hover { background: var(--tan); color: #F7F3EA; }
.source-tab[aria-pressed="true"] { background: var(--forest); color: #F7F3EA; }

.saved-meta { font-size: 12px; color: var(--meta); margin: 16px 0 0 0; }

/* ===== Grid ===== */
.saved-grid { margin-top: 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

.saved-card { display: flex; flex-direction: column; transition: opacity .2s ease; }
.saved-card.removing { opacity: 0; pointer-events: none; }
.saved-image-wrap { position: relative; border-radius: 14px; overflow: hidden; }
.saved-image { width: 100%; height: 170px; object-fit: cover; }

.source-badge {
  position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase;
  padding: 4px 9px; border-radius: 7px; color: #F7F3EA;
}
.source-badge.family { background: rgba(85,124,94,0.88); }
.source-badge.community { background: rgba(41,36,31,0.72); }

.unsave-btn {
  position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%;
  background: rgba(247,243,234,0.92); border: none;
  display: flex; align-items: center; justify-content: center; color: var(--clay);
}
.unsave-btn:hover { background: #FFFDF8; }
.unsave-btn svg { width: 15px; height: 15px; fill: var(--clay); }

.saved-caption { padding: 12px 2px 0 2px; }
.saved-caption a.title-link h3 {
  font-family: var(--font-display); font-size: 16px; font-weight: 600; color: var(--ink); margin: 0 0 3px 0;
}
.saved-caption .caption-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.saved-caption .by { font-size: 12.5px; color: var(--muted); margin: 0; }
.type-icon {
  width: 26px; height: 26px; border-radius: 50%; background: var(--cream-2);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.type-icon svg { width: 13px; height: 13px; color: var(--clay); }

/* ===== Empty state ===== */
.empty-state {
  margin-top: 28px; padding: 64px 24px; text-align: center;
  border: 1px dashed var(--border); border-radius: 14px; background: var(--surface);
}
.empty-state svg { width: 34px; height: 34px; color: var(--tan); margin-bottom: 12px; }
.empty-state h3 { font-family: var(--font-display); font-size: 19px; color: var(--ink); margin: 0 0 6px 0; }
.empty-state p { font-size: 14px; color: var(--muted); margin: 0; }

@media (max-width: 1150px) {
  .app-sidebar { display: none; }
  .saved-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 800px) {
  .saved-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .app-content { padding: 28px 20px 56px 20px; }
  .header-search { width: 100%; }
}
@media (max-width: 550px) {
  .saved-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app-shell">

  <aside class="app-sidebar">
    <div>
      <div class="sidebar-logo">
        Corner Stone
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V13"/><path d="M12 13c0-4 3-6 7-6-1 4-3 6-7 6Z"/><path d="M12 13c0-3-2.5-5-6-5 .8 3 2.5 5 6 5Z"/></svg>
      </div>
      <nav class="sidebar-nav" aria-label="Primary">
        <a href="home.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          Home
        </a>
        <a href="family.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><circle cx="18" cy="8" r="2.4"/><path d="M16 21c0-2.8 1.6-4.8 4-5.6"/></svg>
          My Family
        </a>
        <a href="family.html#add">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Memory
        </a>
        <a href="community.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.5 3.8 5.6 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3Z"/></svg>
          Community
        </a>
        <a href="saved.html" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4.5 8-11.2V5l-8-3-8 3v5.8C4 17.5 12 22 12 22Z"/></svg>
          Saved
        </a>
      </nav>
    </div>
    <nav class="sidebar-nav">
      <a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1Z"/></svg>
        Settings
      </a>
    </nav>
  </aside>

  <div class="app-main">
    <main class="app-content">

      <div class="saved-header">
        <div>
          <h1>Saved</h1>
          <p>Memories and recipes you've bookmarked to come back to, from your family and the wider community.</p>
        </div>
        <div class="header-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="search" id="search-input" placeholder="Search saved..." aria-label="Search saved">
        </div>
      </div>

      <div class="source-tabs" role="group" aria-label="Filter by source">
        <button class="source-tab" type="button" data-source="All" aria-pressed="true">All</button>
        <button class="source-tab" type="button" data-source="Family" aria-pressed="false">My Family</button>
        <button class="source-tab" type="button" data-source="Community" aria-pressed="false">Community</button>
      </div>

      <p class="saved-meta" id="saved-meta"></p>

      <section class="saved-grid" id="saved-grid" aria-label="Saved posts"></section>

      <div class="empty-state" id="empty-state" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4.5 8-11.2V5l-8-3-8 3v5.8C4 17.5 12 22 12 22Z"/></svg>
        <h3>Nothing saved here yet</h3>
        <p>Bookmark memories from your Family Board or the Community Archive to find them here.</p>
      </div>

    </main>
  </div>
</div>

<script>
(function () {

  const SAVED = [
    { id: "lola-adobo", title: "Lola's Adobo", category: "Recipes", source: "Family",
      contributor: "by Lola", image: "https://images.unsplash.com/photo-1598515213692-5f252f04f1af?w=500&q=80",
      linkable: true },
    { id: "bibingka", title: "Bibingka for Simbang Gabi", category: "Recipes", source: "Family",
      contributor: "by Lola", image: "https://images.unsplash.com/photo-1617093727343-374698b1b08d?w=500&q=80",
      linkable: true },
    { id: "fiesta-2024", title: "Fiesta 2024", category: "Memories", source: "Family",
      contributor: "by Nanay", image: "https://images.unsplash.com/photo-1511895426328-dc8714191300?w=500&q=80" },
    { id: "soy-sauce-chicken", title: "Soy Sauce Chicken", category: "Recipes", source: "Community",
      contributor: "by The Wong Family", image: "https://images.unsplash.com/photo-1546430782-93a04b6cf1a1?w=500&q=80" },
    { id: "dolma-from-beirut", title: "Dolma from Beirut", category: "Recipes", source: "Community",
      contributor: "by The Haddad Family", image: "https://images.unsplash.com/photo-1615719413546-198b25453f85?w=500&q=80" },
    { id: "song-my-mother-taught-me", title: "The Song My Mother Taught Me", category: "Music", source: "Community",
      contributor: "by a Greek-Australian family", image: "https://images.unsplash.com/photo-1465847899084-d164df4dedc6?w=500&q=80" },
    { id: "letters-from-ilocos", title: "Letters from Ilocos", category: "Family History", source: "Family",
      contributor: "by Tatay", image: "https://images.unsplash.com/photo-1518281420975-50db6e5d0a97?w=500&q=80" },
    { id: "diwali-lights", title: "Diwali Lights at Grandma's House", category: "Traditions", source: "Community",
      contributor: "by The Nair Family", image: "https://images.unsplash.com/photo-1604423043492-b9c1e8f6c7e6?w=500&q=80" }
  ];

  const CATEGORY_ICONS = {
    Recipes: '<path d="M6 3v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3"/><path d="M8 12v9"/><path d="M17 3c-1.5 1.5-2 3-2 5s.5 3 2 4v9"/>',
    Stories: '<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5v-17Z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>',
    Traditions: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    Memories: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>',
    Music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    "Family History": '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/>'
  };

  let savedItems = SAVED.slice();
  const state = { source: "All", query: "" };

  const gridEl = document.getElementById("saved-grid");
  const emptyEl = document.getElementById("empty-state");
  const metaEl = document.getElementById("saved-meta");
  const searchInput = document.getElementById("search-input");
  const tabs = document.querySelectorAll(".source-tab");

  function iconSvg(key) {
    const path = CATEGORY_ICONS[key];
    if (!path) return "";
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + path + '</svg>';
  }

  function matchesFilters(item) {
    const sourceOk = state.source === "All" || item.source === state.source;
    let queryOk = true;
    if (state.query.trim().length > 0) {
      const q = state.query.trim().toLowerCase();
      queryOk = [item.title, item.contributor, item.category].join(" ").toLowerCase().includes(q);
    }
    return sourceOk && queryOk;
  }

  function render() {
    const filtered = savedItems.filter(matchesFilters);
    metaEl.textContent = filtered.length + " saved " + (filtered.length === 1 ? "item" : "items");
    emptyEl.hidden = filtered.length !== 0;
    gridEl.innerHTML = "";

    filtered.forEach(function (item) {
      const card = document.createElement("article");
      card.className = "saved-card";
      card.dataset.id = item.id;

      const titleHtml = item.linkable
        ? '<a class="title-link" href="post.html"><h3>' + item.title + '</h3></a>'
        : '<div class="title-link"><h3>' + item.title + '</h3></div>';

      card.innerHTML =
        '<div class="saved-image-wrap">' +
          '<img class="saved-image" src="' + item.image + '" alt="' + item.title + '">' +
          '<span class="source-badge ' + (item.source === "Family" ? "family" : "community") + '">' + (item.source === "Family" ? "My Family" : "Community") + '</span>' +
          '<button class="unsave-btn" type="button" aria-label="Remove from saved" data-unsave="' + item.id + '">' +
            '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="saved-caption">' +
          titleHtml +
          '<div class="caption-row">' +
            '<p class="by">' + item.contributor + '</p>' +
            '<span class="type-icon">' + iconSvg(item.category) + '</span>' +
          '</div>' +
        '</div>';

      gridEl.appendChild(card);
    });

    gridEl.querySelectorAll("[data-unsave]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        const id = btn.getAttribute("data-unsave");
        const card = gridEl.querySelector('[data-id="' + id + '"]');
        card.classList.add("removing");
        setTimeout(function () {
          savedItems = savedItems.filter(function (it) { return it.id !== id; });
          render();
        }, 180);
      });
    });
  }

  tabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      tabs.forEach(function (t) { t.setAttribute("aria-pressed", "false"); });
      tab.setAttribute("aria-pressed", "true");
      state.source = tab.getAttribute("data-source");
      render();
    });
  });

  searchInput.addEventListener("input", function (e) {
    state.query = e.target.value;
    render();
  });

  render();

})();
</script>
</body>
</html>
