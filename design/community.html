<style>
:root {
  --ink: #29241F;
  --sidebar: #221D18;
  --sidebar-text: #C7BFAF;
  --sidebar-text-active: #F7F3EA;
  --paper: #F5F0E6;
  --surface: #FFFFFF;
  --cream: #EFE7D8;
  --cream-2: #E9E0CE;
  --tan: #CBB89A;
  --clay: #A67C52;
  --brown: #6D5B45;
  --forest: #557C5E;
  --forest-dark: #44614C;
  --pale-forest: #E4EAE1;
  --border: #E4DDCC;
  --muted: #6F6656;
  --meta: #948A78;

  --font-display: "Playfair Display", Georgia, serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}
img { display: block; max-width: 100%; }
button { font-family: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--forest); outline-offset: 2px; }
ul, ol { margin: 0; padding: 0; }
[hidden] { display: none !important; }

/* ===== Shell ===== */
.app-shell { display: flex; min-height: 100vh; }

.app-sidebar {
  width: 200px; flex-shrink: 0; background: var(--sidebar); color: var(--sidebar-text);
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 22px 14px; position: sticky; top: 0; height: 100vh;
}
.sidebar-logo {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--font-display); font-size: 21px; font-weight: 600;
  letter-spacing: 0.5px; color: var(--sidebar-text-active); padding: 6px 10px 26px 10px;
}
.sidebar-logo svg { width: 15px; height: 15px; color: var(--tan); flex-shrink: 0; }
.sidebar-nav { display: flex; flex-direction: column; gap: 3px; }
.sidebar-nav a {
  display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 9px;
  color: var(--sidebar-text); font-size: 14px; font-weight: 500;
}
.sidebar-nav a svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-nav a:hover { color: var(--sidebar-text-active); background: rgba(247,243,234,0.06); }
.sidebar-nav a[aria-current="page"] { color: var(--sidebar-text-active); background: rgba(247,243,234,0.1); }

.app-main { flex: 1; min-width: 0; }
.app-content { padding: 40px 44px 72px 44px; }

/* ===== Header row ===== */
.archive-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap;
}
.archive-header h1 {
  font-family: var(--font-display); font-size: 30px; font-weight: 600; color: var(--ink); margin: 0 0 6px 0;
}
.archive-header p { font-size: 14px; color: var(--muted); margin: 0; }

.header-search {
  display: flex; align-items: center; width: 260px; height: 42px;
  background: var(--cream); border: 1px solid var(--border); border-radius: 21px; padding: 0 16px;
  flex-shrink: 0; margin-top: 2px;
}
.header-search svg { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
.header-search input {
  border: none; background: transparent; outline: none;
  font-family: var(--font-body); font-size: 13.5px; color: var(--ink); margin-left: 9px; width: 100%;
}
.header-search input::placeholder { color: var(--meta); }

/* ===== Culture chips ===== */
.culture-nav { margin-top: 26px; }
.culture-list { display: flex; flex-wrap: wrap; gap: 9px; list-style: none; margin: 0; padding: 0; position: relative; }
.culture-chip {
  height: 40px; padding: 0 20px; border-radius: 20px; border: none;
  background: var(--cream-2); color: var(--ink); font-family: var(--font-body); font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
}
.culture-chip:hover { background: var(--tan); color: #F7F3EA; }
.culture-chip[aria-pressed="true"] { background: var(--forest); color: #F7F3EA; }
.culture-chip.more-chip { background: transparent; color: var(--muted); position: relative; }
.culture-chip.more-chip svg { width: 14px; height: 14px; }
.more-dropdown {
  position: absolute; top: 46px; left: 0; z-index: 6;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 12px 30px rgba(41,36,31,0.14); padding: 6px; min-width: 160px; display: none;
}
.more-dropdown.open { display: block; }
.more-dropdown button {
  display: block; width: 100%; text-align: left; background: none; border: none;
  padding: 9px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--ink);
}
.more-dropdown button:hover { background: var(--cream); }

/* ===== Layout ===== */
.archive-layout { margin-top: 30px; display: flex; align-items: flex-start; gap: 36px; }

.category-sidebar { width: 168px; flex-shrink: 0; }
.category-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.category-item {
  width: 100%; height: 40px; padding: 0 12px; border-radius: 10px; border: none; background: transparent;
  color: var(--ink); font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px; text-align: left;
}
.category-item svg { width: 17px; height: 17px; color: var(--muted); flex-shrink: 0; }
.category-item:hover { background: var(--cream); }
.category-item[aria-current="true"] { background: var(--forest); color: #F7F3EA; }
.category-item[aria-current="true"] svg { color: #F7F3EA; }

.archive-content { flex: 1; min-width: 0; }

.section-title-row h2 {
  font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--ink); margin: 0;
  display: inline-block; position: relative;
}
.section-underline { display: block; width: 92px; height: 8px; margin-top: 2px; }
.section-title-row p.meta { font-size: 12px; color: var(--meta); margin: 8px 0 0 0; }

/* ===== Featured memory ===== */
.featured-memory {
  margin-top: 20px; width: 100%; height: 232px; border-radius: 16px;
  border: 1px solid var(--border); background: var(--surface); display: flex; overflow: hidden;
}
.featured-memory .featured-image { width: 380px; height: 232px; flex-shrink: 0; object-fit: cover; }
.featured-memory .featured-body { padding: 26px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.featured-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--clay); margin: 0 0 8px 0; }
.featured-body h3 { font-family: var(--font-display); font-size: 24px; font-weight: 600; color: var(--ink); margin: 0 0 6px 0; }
.featured-tags { font-size: 12px; color: var(--meta); margin: 0 0 12px 0; }
.featured-body p.excerpt { font-size: 14px; line-height: 21px; color: var(--muted); margin: 0 0 14px 0; max-width: 460px; }
.featured-link { font-size: 13px; font-weight: 600; color: var(--forest); display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; }
.featured-link svg { width: 14px; height: 14px; }

/* ===== Post grid (flat card style) ===== */
.post-grid { margin-top: 24px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.archive-card { display: block; }
.archive-image-wrap { border-radius: 14px; overflow: hidden; }
.archive-image { width: 100%; height: 170px; object-fit: cover; }
.archive-caption { padding: 12px 2px 0 2px; }
.archive-caption h3 {
  font-family: var(--font-display); font-size: 16px; font-weight: 600; color: var(--ink); margin: 0 0 3px 0;
}
.archive-caption .caption-row { display: flex; align-items: center; justify-content: space-between; }
.archive-caption .by { font-size: 12.5px; color: var(--muted); margin: 0; }
.type-icon {
  width: 26px; height: 26px; border-radius: 50%; background: var(--cream-2);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.type-icon svg { width: 13px; height: 13px; color: var(--clay); }

.empty-state {
  margin-top: 26px; padding: 56px 24px; text-align: center;
  border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
}
.empty-state h3 { font-family: var(--font-display); font-size: 19px; color: var(--ink); margin: 0 0 6px 0; }
.empty-state p { font-size: 14px; color: var(--muted); margin: 0; }

/* ===== Load more ===== */
.load-more-row { margin-top: 32px; text-align: center; }
.load-more-btn {
  height: 44px; padding: 0 24px; border-radius: 22px;
  background: var(--cream); border: 1px solid var(--border); color: var(--ink);
  font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
}
.load-more-btn:hover { border-color: var(--clay); }
.load-more-btn svg { width: 15px; height: 15px; }

@media (max-width: 1150px) {
  .app-sidebar { display: none; }
  .post-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 900px) {
  .archive-layout { flex-direction: column; }
  .category-sidebar { width: 100%; }
  .category-list { flex-direction: row; flex-wrap: wrap; }
  .featured-memory { flex-direction: column; height: auto; }
  .featured-memory .featured-image { width: 100%; height: 180px; }
}
@media (max-width: 800px) {
  .post-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .app-content { padding: 28px 20px 56px 20px; }
  .header-search { width: 100%; }
  .culture-list { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
  .culture-chip { flex-shrink: 0; }
}
@media (max-width: 550px) {
  .post-grid { grid-template-columns: 1fr; }
}
</style>

      desc: "A bundle of letters between my great-grandparents, found in an old chest.",
      contributor: "by The Park Family", image: "https://images.unsplash.com/photo-1518281420975-50db6e5d0a97?w=900&q=80" },
    { id: "the-recipe-box", title: "The Recipe Box", type: "Memory", culture: "Filipino", category: "Memories",
      desc: "Index cards in my mother's handwriting, stained with forty years of cooking.",
      contributor: "by The Santos Family", image: "https://images.unsplash.com/photo-1495521821757-a1efb6729352?w=900&q=80" },
    { id: "banh-chung-for-tet", title: "Bánh Chưng for Tết", type: "Tradition", culture: "Vietnamese", category: "Traditions",
      desc: "Square rice cakes wrapped in banana leaf, boiled overnight by the whole family.",
      contributor: "by The Nguyen Family", image: "https://images.unsplash.com/photo-1609501676725-7186f017a4b7?w=900&q=80" }
  ];

  const PAGE_SIZE = 8;
  const state = { culture: "All", category: "All", query: "", visible: PAGE_SIZE };

  const cultureListEl = document.getElementById("culture-list");
  const categoryListEl = document.getElementById("category-list");
  const featuredEl = document.getElementById("featured-memory");
  const gridEl = document.getElementById("post-grid");
  const emptyEl = document.getElementById("empty-state");
  const sectionTitleEl = document.getElementById("section-title");
  const sectionMetaEl = document.getElementById("section-meta");
  const searchInput = document.getElementById("search-input");
  const loadMoreRow = document.getElementById("load-more-row");
  const loadMoreBtn = document.getElementById("load-more-btn");

  function iconSvg(key) {
    const path = CATEGORY_ICONS[key];
    if (!path) return "";
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + path + '</svg>';
  }

  function renderCultureList() {
    cultureListEl.innerHTML = "";
    CULTURES.forEach(function (culture) {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.className = "culture-chip";
      btn.type = "button";
      btn.textContent = culture;
      btn.setAttribute("aria-pressed", String(state.culture === culture));
      btn.addEventListener("click", function () {
        state.culture = culture; state.visible = PAGE_SIZE;
        renderCultureList(); renderAll();
      });
      li.appendChild(btn);
      cultureListEl.appendChild(li);
    });

    const moreLi = document.createElement("li");
    moreLi.style.position = "relative";
    const moreBtn = document.createElement("button");
    moreBtn.className = "culture-chip more-chip";
    moreBtn.type = "button";
    moreBtn.innerHTML = 'More <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';
    const dropdown = document.createElement("div");
    dropdown.className = "more-dropdown";
    MORE_CULTURES.forEach(function (c) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c;
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        state.culture = c; state.visible = PAGE_SIZE;
        dropdown.classList.remove("open");
        renderCultureList(); renderAll();
      });
      dropdown.appendChild(b);
    });
    moreBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      dropdown.classList.toggle("open");
    });
    moreLi.appendChild(moreBtn);
    moreLi.appendChild(dropdown);
    cultureListEl.appendChild(moreLi);
  }
  document.addEventListener("click", function () {
    document.querySelectorAll(".more-dropdown.open").forEach(function (d) { d.classList.remove("open"); });
  });

  function renderCategoryList() {
    categoryListEl.innerHTML = "";
    CATEGORIES.forEach(function (cat) {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.className = "category-item";
      btn.type = "button";
      btn.setAttribute("aria-current", String(state.category === cat.key));
      btn.innerHTML = iconSvg(cat.key) + "<span>" + cat.label + "</span>";
      btn.addEventListener("click", function () {
        state.category = cat.key; state.visible = PAGE_SIZE;
        renderCategoryList(); renderAll();
      });
      li.appendChild(btn);
      categoryListEl.appendChild(li);
    });
  }

  function matchesFilters(post) {
    const cultureOk = state.culture === "All" || post.culture === state.culture;
    const categoryOk = state.category === "All" || post.category === state.category;
    let queryOk = true;
    if (state.query.trim().length > 0) {
      const q = state.query.trim().toLowerCase();
      queryOk = [post.title, post.desc, post.culture, post.category].join(" ").toLowerCase().includes(q);
    }
    return cultureOk && categoryOk && queryOk;
  }

  function sectionTitleFor() {
    if (state.query.trim().length > 0) return 'Results for "' + state.query.trim() + '"';
    const hasCulture = state.culture !== "All", hasCategory = state.category !== "All";
    if (hasCulture && hasCategory) return state.category + " from " + state.culture + " families";
    if (hasCulture) return "Contributions from " + state.culture + " families";
    if (hasCategory) return state.category;
    return "All Contributions";
  }

  function renderFeatured(posts) {
    const featured = posts.find(function (p) { return p.featured; });
    if (!featured) { featuredEl.hidden = true; featuredEl.innerHTML = ""; return; }
    featuredEl.hidden = false;
    featuredEl.innerHTML =
      '<img class="featured-image" src="' + featured.image + '" alt="' + featured.title + '">' +
      '<div class="featured-body">' +
        '<p class="featured-eyebrow">Featured Memory</p>' +
        '<h3>' + featured.title + '</h3>' +
        '<p class="featured-tags">' + featured.culture + ' &middot; ' + featured.type + '</p>' +
        '<p class="excerpt">' + featured.desc + '</p>' +
        '<a class="featured-link" href="' + (featured.linkable ? "post.html" : "#") + '">Read the full story ' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>' +
        '</a>' +
      '</div>';
  }

  function renderGrid(posts) {
    const rest = posts.filter(function (p) { return !p.featured; });
    const shown = rest.slice(0, state.visible);
    gridEl.innerHTML = "";
    emptyEl.hidden = posts.length !== 0;

    shown.forEach(function (post) {
      const card = document.createElement("a");
      card.className = "archive-card";
      card.href = post.linkable ? "post.html" : "#";
      card.innerHTML =
        '<div class="archive-image-wrap"><img class="archive-image" src="' + post.image + '" alt="' + post.title + '"></div>' +
        '<div class="archive-caption">' +
          '<h3>' + post.title + '</h3>' +
          '<div class="caption-row">' +
            '<p class="by">' + post.contributor + '</p>' +
            '<span class="type-icon">' + iconSvg(post.category === "Family History" ? "Family History" : post.category) + '</span>' +
          '</div>' +
        '</div>';
      gridEl.appendChild(card);
    });

    loadMoreRow.hidden = rest.length <= state.visible;
  }

  function renderAll() {
    const filtered = POSTS.filter(matchesFilters);
    sectionTitleEl.textContent = sectionTitleFor();
    const cultureLabel = state.culture === "All" ? "All cultures" : state.culture;
    const categoryLabel = state.category === "All" ? "All categories" : state.category;
    sectionMetaEl.textContent = cultureLabel + " \u00b7 " + categoryLabel + " \u00b7 " + filtered.length + " contribution" + (filtered.length === 1 ? "" : "s");

    const showFeatured = state.query.trim().length === 0 && filtered.some(function (p) { return p.featured; });
    renderFeatured(showFeatured ? filtered : []);
    renderGrid(filtered);
  }

  searchInput.addEventListener("input", function (e) {
    state.query = e.target.value; state.visible = PAGE_SIZE;
    renderAll();
  });

  loadMoreBtn.addEventListener("click", function () {
    state.visible += PAGE_SIZE;
    renderAll();
  });

  renderCultureList();
  renderCategoryList();
  renderAll();

})();
</script>
</body>
</html>
