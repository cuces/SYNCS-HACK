<!--
  map.html — "Roots" map view.

  Renders the SAME lineage tree the community graph shows (via getFullTree from
  db.js), but plotted geographically instead of relationally:
    - one marker per post that has lat/lng set
    - one line per adapted_from edge where both ends have a location

  The plotting itself lives in mapView.js (plotTreeOnMap) so it can be unit
  tested — see test/map.test.html.

  STANDALONE DEMO: opened on its own, this page seeds a small demo lineage
  (Vietnam → Mexico → France, plus one post with no location) so there is
  something to look at. Delete seedDemoData()/the call to it once map.html is
  wired into the real app and getFullTree() has real data to walk.

  Note: Leaflet's map tiles come from OpenStreetMap, so this one view needs
  internet access even though the rest of the app is offline.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Map view</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; color: #292821; background: #f7f3eb; }
  h1 { font-size: 1.1rem; }

  #view-container {
    position: relative;
    width: 100%;
    height: 500px;
    border: 1px solid #d8d3c4;
    border-radius: 8px;
    overflow: hidden;
    background: #faf8f3;
  }

  #graph-view,
  #map-view { position: absolute; inset: 0; }

  /* Map view starts hidden — graph view is the default */
  #map-view { display: none; }

  #graph-view {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8a8375;
    font-size: 0.9rem;
  }

  #toggle-view-btn {
    margin-bottom: 10px;
    padding: 8px 16px;
    border: 1px solid #c9a876;
    border-radius: 6px;
    background: #fff;
    color: #6b5c3d;
    font-size: 0.9rem;
    cursor: pointer;
  }
  #toggle-view-btn:hover { background: #f3ead9; }

  /* Filter bar — only relevant while the map view is showing */
  #map-filters {
    display: none;
    gap: 16px;
    align-items: center;
    margin-bottom: 10px;
    font-size: 0.85rem;
    color: #4c4941;
  }
  #map-filters label { display: inline-flex; align-items: center; gap: 6px; }
  #map-filters select {
    padding: 5px 8px;
    border: 1px solid #d8d1c4;
    border-radius: 6px;
    background: #fff;
    color: #292821;
    font-size: 0.85rem;
  }
  #map-filters button {
    padding: 5px 10px;
    border: 1px solid #d8d1c4;
    border-radius: 6px;
    background: #fff;
    color: #6b5c3d;
    font-size: 0.8rem;
    cursor: pointer;
  }
  #map-filters button:hover { background: #f3ead9; }

  #status {
    margin-top: 12px;
    font-size: 0.82rem;
    font-family: ui-monospace, monospace;
    white-space: pre-wrap;
    color: #4c4941;
  }

  .leaflet-popup-content { font-family: system-ui, sans-serif; font-size: 0.85rem; }
</style>
</head>
<body>

  <h1>Roots — map view</h1>

  <button id="toggle-view-btn">Show map view</button>

  <!-- Two filters for the map dots: by country and by tag. Combine (AND). -->
  <div id="map-filters">
    <label>Country
      <select id="filter-country"><option value="">All</option></select>
    </label>
    <label>Tag
      <select id="filter-tag"><option value="">All</option></select>
    </label>
    <button id="filter-clear" type="button">Clear filters</button>
  </div>

  <div id="view-container">
    <!-- The real vis-network graph lives here in the app; placeholder for now. -->
    <div id="graph-view">(graph view goes here — the vis-network container)</div>
    <div id="map-view"></div>
  </div>

  <div id="status">loading…</div>

  <!-- Leaflet first, then Dexie + our db/geo/mapView modules -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
  <script src="geo.js"></script>
  <script src="db.js"></script>
  <script src="mapView.js"></script>

  <script>
    // The Leaflet map instance and the layers we've drawn, so we can clear
    // them before every redraw (otherwise layers just stack up).
    let map = null;
    let drawnLayers = [];

    // Set up the Leaflet map once, the first time the map view is opened.
    function initMap() {
      if (map) return;
      map = L.map("map-view").setView([20, 0], 2);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);
    }

    function clearMap() {
      drawnLayers.forEach((layer) => map.removeLayer(layer));
      drawnLayers = [];
    }

    // The full (unfiltered) tree currently loaded, so the filters can be
    // re-applied without re-querying the database.
    let currentTree = { nodes: [], edges: [] };

    const countrySelect = document.getElementById("filter-country");
    const tagSelect = document.getElementById("filter-tag");
    const clearFiltersBtn = document.getElementById("filter-clear");

    // Fill the two <select>s from whatever countries/tags exist in `tree`,
    // keeping the current choice if it's still available.
    function populateFilters(tree) {
      const fill = (select, values) => {
        const previous = select.value;
        select.innerHTML = '<option value="">All</option>';
        for (const v of values) {
          const opt = document.createElement("option");
          opt.value = v;
          opt.textContent = v;
          select.appendChild(opt);
        }
        select.value = values.includes(previous) ? previous : "";
      };
      fill(countrySelect, distinctCountries(tree)); // helpers from mapView.js
      fill(tagSelect, distinctTags(tree));
    }

    // Draw the map using the current tree filtered by the current selections.
    function applyFiltersAndRender() {
      initMap();
      map.invalidateSize(); // container may have just been un-hidden
      clearMap();

      const filters = { country: countrySelect.value, tag: tagSelect.value };
      const shown = filterTree(currentTree, filters); // filtering lives in mapView.js
      const result = plotTreeOnMap(map, shown);
      drawnLayers = result.layers;

      const points = shown.nodes
        .filter((p) => p.lat != null && p.lng != null)
        .map((p) => [p.lat, p.lng]);
      if (points.length) map.fitBounds(points, { padding: [40, 40], maxZoom: 5 });

      const filterNote =
        !filters.country && !filters.tag
          ? "no filter"
          : [
              filters.country && `country = ${filters.country}`,
              filters.tag && `tag = ${filters.tag}`,
            ]
              .filter(Boolean)
              .join(", ");
      statusEl.textContent =
        `Filter: ${filterNote}\n` +
        `Plotted: ${result.markers} markers, ${result.lines} lines.\n` +
        `Hidden: ${currentTree.nodes.length - shown.nodes.length} post(s) by filter, ` +
        `${result.skipped} with no location.`;

      return result;
    }

    // Pull the SAME tree the graph view uses, then plot it geographically.
    async function renderMapView(rootPostId) {
      currentTree = await getFullTree(rootPostId); // { nodes, edges } — reused from db.js
      populateFilters(currentTree);
      return applyFiltersAndRender();
    }

    countrySelect.addEventListener("change", applyFiltersAndRender);
    tagSelect.addEventListener("change", applyFiltersAndRender);
    clearFiltersBtn.addEventListener("click", () => {
      countrySelect.value = "";
      tagSelect.value = "";
      applyFiltersAndRender();
    });

    // ---------- STANDALONE DEMO DATA (delete once wired into the real app) ----------

    // Seeds a small lineage so the map has something to show on its own:
    //
    //   Vietnam ──▶ Mexico ──▶ France
    //      └──▶ (a post with NO location)
    //
    async function seedDemoData() {
      await Promise.all([db.posts.clear(), db.families.clear()]);
      const familyId = await createFamily("Demo Family");

      const make = (title, country, tags, adapted_from = null) => {
        const c = countryToLatLng(country); // country → lat/lng, exactly what the form will do
        return createPost({
          poster_id: 1,
          family_id: familyId,
          title,
          description: "",
          file: null,
          category: "recipe",
          tags,
          adapted_from,
          is_published: true,
          country: country || null,
          lat: c ? c.lat : null,
          lng: c ? c.lng : null,
        });
      };

      const vietnam = await make("Phở (grandmother's original)", "Vietnam", ["vietnamese", "soup"]);
      const mexico = await make("Phở-style caldo", "Mexico", ["mexican", "soup"], vietnam);
      await make("Pot-au-phở", "France", ["french", "stew"], mexico);
      await make("Aunt's handwritten note (no country given)", null, ["vietnamese", "note"], vietnam);

      return vietnam; // the root of the tree
    }

    // ---------- Toggle + boot ----------

    const toggleBtn = document.getElementById("toggle-view-btn");
    const graphView = document.getElementById("graph-view");
    const mapView = document.getElementById("map-view");
    const statusEl = document.getElementById("status");
    let showingMap = false;
    let demoRootId = null;

    async function boot() {
      demoRootId = await seedDemoData();
      const total = await db.posts.count();
      statusEl.textContent =
        `Seeded ${total} demo posts (3 with a country, 1 without).\n` +
        `Click "Show map view" — expect 3 markers and 2 connecting lines.`;
    }

    const filterBar = document.getElementById("map-filters");

    toggleBtn.addEventListener("click", async () => {
      showingMap = !showingMap;
      graphView.style.display = showingMap ? "none" : "flex";
      mapView.style.display = showingMap ? "block" : "none";
      filterBar.style.display = showingMap ? "flex" : "none";
      toggleBtn.textContent = showingMap ? "Show graph view" : "Show map view";

      if (showingMap) {
        await renderMapView(demoRootId); // sets the status line itself
      }
    });

    boot();
  </script>

</body>
</html>
