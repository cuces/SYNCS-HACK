<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corner Stone — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #f4eee2 0%, #efe7d8 100%);
      padding: 24px;
    }

    .auth-shell {
      width: min(100%, 440px);
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #e2dac8;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(42, 37, 31, 0.08);
      padding: 32px 28px;
    }

    .auth-brand {
      margin-bottom: 18px;
    }

    .auth-brand strong {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 2rem;
      color: #2a251f;
      display: block;
      margin-bottom: 4px;
    }

    .auth-brand span {
      color: #675e4f;
      font-size: 0.95rem;
    }

    .auth-card h1 {
      margin: 0 0 8px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 2.25rem;
      color: #2a251f;
      line-height: 1.1;
    }

    .auth-card p {
      margin: 0 0 20px;
      color: #675e4f;
    }

    .auth-form {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #726957;
    }

    .field input {
      width: 100%;
      height: 46px;
      border-radius: 12px;
      border: 1px solid #d9cfbb;
      background: #fff;
      padding: 0 14px;
      font: inherit;
      color: #2a251f;
    }

    .field input:focus {
      outline: none;
      border-color: #52785b;
      box-shadow: 0 0 0 3px rgba(82, 120, 91, 0.18);
    }

    .auth-actions {
      display: grid;
      gap: 12px;
      margin-top: 8px;
    }

    .btn {
      width: 100%;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      background: #52785b;
      color: #f8f5ec;
      height: 46px;
      font-size: 0.96rem;
      font-weight: 600;
      transition: background 150ms ease;
    }

    .btn:hover {
      background: #3f5e49;
    }

    .auth-alt {
      text-align: center;
      font-size: 0.96rem;
      color: #675e4f;
    }

    .auth-alt a {
      color: #52785b;
      font-weight: 600;
    }

    .auth-message {
      min-height: 22px;
      margin: 0;
      font-size: 0.92rem;
      color: #2a251f;
    }

    .auth-message-error {
      color: #a04b3f;
    }

    .auth-message-success {
      color: #3f5e49;
    }
  </style>
</head>
<body data-auth-mode="login">
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <strong>Corner Stone</strong>
        <span>Keep your family's stories close.</span>
      </div>

      <h1>Welcome back</h1>
      <p>Sign in to revisit recipes, memories, and family traditions.</p>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="field">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
        </div>

        <p id="authMessage" class="auth-message" aria-live="polite"></p>

        <div class="auth-actions">
          <button class="btn" type="submit">Log in</button>
          <div class="auth-alt">
            Need an account? <a href="signup.html">Create one</a>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
  <script src="../db.js"></script>
  <script src="../auth.js"></script>
</body>
</html>
