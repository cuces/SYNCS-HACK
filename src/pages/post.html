<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corner Stone — Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #2A251F;
  --paper: #EBE3D2;
  --surface: #FFFFFF;
  --card: #F5F0E6;
  --cream: #EFE7D8;
  --cream-2: #E8DFCD;
  --tan: #C9B69A;
  --clay: #A2794F;
  --brown: #6B5A45;
  --forest: #52785B;
  --forest-dark: #3F5E49;
  --border: #E2DAC8;
  --border-strong: #D4CAB4;
  --hairline: #E7DFCF;
  --muted: #675E4F;
  --meta: #726957;
  --danger: #A04B3F;

  --font-display: "Playfair Display", Georgia, "Times New Roman", serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;

  --radius-xs: 8px; --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-xl: 24px;

  --shadow-sm: 0 1px 3px rgba(42,37,31,0.06), 0 4px 12px rgba(42,37,31,0.05);
  --shadow-lg: 0 24px 56px rgba(42,37,31,0.13), 0 6px 16px rgba(42,37,31,0.07);

  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --transition: 150ms var(--ease);
  --ring: 0 0 0 3px rgba(82, 120, 91, 0.28);

  /* Width of the memory card and the lineage map on this page. */
  --page-max: 840px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  letter-spacing: -0.003em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-8);
  padding: 56px 20px 72px;
}
img { display: block; max-width: 100%; }
button { font-family: inherit; cursor: pointer; color: inherit; }
a { color: inherit; text-decoration: none; }
::selection { background: rgba(82, 120, 91, 0.18); }
:focus-visible { outline: 2px solid var(--forest); outline-offset: 2px; }
ul, ol { margin: 0; padding: 0; }
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; }
}

.card {
  width: 100%;
  max-width: var(--page-max);
  background: var(--card);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-xl);
  padding: var(--space-5) var(--space-5) var(--space-6);
  box-shadow: var(--shadow-lg);
  position: relative;
}

/* ===== Header row ===== */
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--space-4);
}
.back-link {
  display: inline-flex; align-items: center; gap: var(--space-2);
  font-size: 14px; font-weight: 600; color: var(--muted);
  background: none; border: none; padding: var(--space-1) 0;
  transition: color var(--transition), gap var(--transition);
}
.back-link svg { width: 16px; height: 16px; }
.back-link:hover { color: var(--forest-dark); gap: 10px; }

.menu-wrap { position: relative; }
.menu-btn {
  width: 32px; height: 32px; border-radius: 50%; border: none; background: none;
  display: flex; align-items: center; justify-content: center; color: var(--muted);
  transition: background var(--transition), color var(--transition);
}
.menu-btn:hover { background: rgba(42,37,31,0.06); color: var(--ink); }
.menu-btn svg { width: 19px; height: 19px; }
.menu-dropdown {
  position: absolute; top: 40px; right: 0; z-index: 5;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  min-width: 168px; padding: var(--space-1); display: none;
}
.menu-dropdown.open { display: block; }
.menu-dropdown button {
  display: flex; align-items: center; gap: var(--space-2); width: 100%;
  background: none; border: none; padding: var(--space-2) var(--space-3); border-radius: var(--radius-xs);
  font-size: 13.5px; font-weight: 500; color: var(--ink); text-align: left;
  transition: background var(--transition);
}
.menu-dropdown button:hover { background: var(--cream); }
.menu-dropdown button svg { width: 15px; height: 15px; color: var(--muted); }
.menu-dropdown button.danger { color: var(--danger); }
.menu-dropdown button.danger svg { color: var(--danger); }

/* ===== Image ===== */
.detail-image-wrap { border-radius: var(--radius-lg); overflow: hidden; background: var(--cream-2); }
.detail-image { width: 100%; height: 300px; object-fit: cover; display: block; }
.detail-image.media-placeholder {
  display: flex; align-items: center; justify-content: center;
  background: var(--pale-forest); color: var(--forest);
}
.detail-image.media-placeholder::before { width: 88px; height: 88px; margin: -44px 0 0 -44px; }
.detail-image.media-placeholder svg { width: 40px; height: 40px; opacity: 0.62; }

/* ===== Title row ===== */
.title-row {
  display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3);
  margin-top: var(--space-6);
}
.title-row h1 {
  font-family: var(--font-display); font-size: 26px; font-weight: 500; color: var(--ink);
  line-height: 1.2; letter-spacing: -0.011em;
  margin: 0; display: flex; align-items: baseline; gap: var(--space-2);
}
.type-badge {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--cream-2); color: var(--clay);
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  transform: translateY(3px);
}
.type-badge svg { width: 13px; height: 13px; }

.save-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface, #FFF);
  display: flex; align-items: center; justify-content: center; color: var(--muted); flex-shrink: 0;
  transition: background var(--transition), border-color var(--transition), color var(--transition);
}
.save-btn:hover { border-color: var(--border-strong); color: var(--ink); }
.save-btn svg { width: 17px; height: 17px; }
.save-btn[aria-pressed="true"] { border-color: var(--clay); background: #FBF3E9; }
.save-btn[aria-pressed="true"] svg { fill: var(--clay); color: var(--clay); }

.type-label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--clay); margin: var(--space-2) 0 0;
}

/* ===== Byline ===== */
.byline { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-5) 0; }
.byline .avatar-photo { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex-shrink: 0; border: 1px solid var(--border); }
.byline .avatar-photo img { width: 100%; height: 100%; object-fit: cover; }
.byline .avatar-photo.monogram {
  display: flex; align-items: center; justify-content: center;
  background: var(--cream-2); color: var(--brown);
  font-family: var(--font-display); font-size: 16px; font-weight: 600;
}
.byline .by-text { font-size: 13px; line-height: 1.45; }
.byline .by-text strong { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink); }
.byline .by-text span { color: var(--meta); font-size: 12.5px; }

/* ===== Body copy ===== */
.description { font-size: 15px; line-height: 1.65; color: var(--ink); margin: 0 0 var(--space-6); }

.section-label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 var(--space-3);
}
.ingredients-list {
  list-style: none; margin: 0 0 var(--space-6); padding: 0;
  display: flex; flex-direction: column; gap: var(--space-2);
}
.ingredients-list li {
  font-size: 13.5px; color: var(--brown); line-height: 1.5;
  padding-left: var(--space-4); position: relative;
}
.ingredients-list li::before {
  content: ""; position: absolute; left: 0; top: 8px;
  width: 5px; height: 5px; border-radius: 50%; background: var(--clay);
}

.steps-block { margin-bottom: var(--space-1); }
.steps-preview {
  font-size: 13.5px; color: var(--brown); line-height: 1.55; margin: 0;
  display: flex; flex-wrap: wrap; align-items: baseline;
}
.steps-preview .step-text { color: var(--brown); }
.steps-preview .view-all {
  font-size: 13px; font-weight: 600; color: var(--forest); background: none; border: none;
  padding: 0; margin-left: var(--space-1);
  transition: color var(--transition);
}
.steps-preview .view-all:hover { color: var(--forest-dark); text-decoration: underline; }

.steps-full { list-style: none; margin: var(--space-3) 0 0; padding: 0; display: none; flex-direction: column; gap: var(--space-3); }
.steps-full.open { display: flex; }
.steps-full li {
  font-size: 13.5px; color: var(--brown); line-height: 1.55;
  display: flex; gap: var(--space-2);
}
.steps-full li .num {
  flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%;
  background: var(--cream-2); color: var(--clay);
  font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  margin-top: 1px;
}

/* ===== Footer buttons ===== */
.privacy-footer {
  margin-top: var(--space-6); padding-top: var(--space-4);
  border-top: 1px solid var(--hairline);
  display: flex; align-items: stretch; flex-wrap: wrap; gap: var(--space-2);
}
.privacy-btn {
  height: 44px; padding: 0 var(--space-4); border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  border: 1px solid var(--border); background: var(--surface); color: var(--muted);
  transition: background var(--transition), border-color var(--transition), color var(--transition), flex var(--transition);
}
.privacy-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
#privacy-private { flex: 0 0 auto; }
#privacy-public { flex: 1; }
.privacy-btn[aria-pressed="true"] { background: var(--forest); border-color: var(--forest); color: #F8F5EC; flex: 1; }
.privacy-btn[aria-pressed="false"] { flex: 0 0 auto; }

/* "Extend memory" — creates the adaptive child in the lineage */
.extend-btn {
  height: 44px; padding: 0 var(--space-4); border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  border: 1px solid var(--clay); background: var(--clay); color: #F8F5EC;
  flex: 1 1 160px;
  transition: background var(--transition), border-color var(--transition);
}
.extend-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.extend-btn:hover { background: #8F6942; border-color: #8F6942; }

/* ===== Loading / missing states ===== */
.card-note {
  padding: var(--space-10) var(--space-3); text-align: center;
}
.card-note h2 {
  font-family: var(--font-display); font-size: 20px; font-weight: 500; letter-spacing: -0.011em;
  margin: 0 0 var(--space-2); color: var(--ink);
}
.card-note p { font-size: 13.5px; color: var(--muted); margin: 0 0 var(--space-5); }
.card-note a {
  display: inline-flex; align-items: center; gap: var(--space-2);
  font-size: 13.5px; font-weight: 600; color: var(--forest);
  transition: color var(--transition);
}
.card-note a:hover { color: var(--forest-dark); }
[hidden] { display: none !important; }

/* ===== Toast (privacy save confirmation) ===== */
.post-toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px);
  background: var(--ink); color: #F8F5EC;
  padding: 10px 18px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg);
  opacity: 0; pointer-events: none; transition: opacity 160ms var(--ease), transform 160ms var(--ease);
  z-index: 100;
}
.post-toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ===== Embedded lineage map / graph (the whole of map.html) ===== */
.lineage-title {
  width: 100%; max-width: var(--page-max);
  font-family: var(--font-display); font-size: 20px; font-weight: 500;
  letter-spacing: -0.011em; color: var(--ink);
  margin: 0 0 calc(-1 * var(--space-3));
}
.lineage-title span {
  display: block; font-family: var(--font-body); font-size: 13px; font-weight: 400;
  color: var(--meta); margin-top: 2px; letter-spacing: -0.003em;
}
.lineage-map {
  width: 100%;
  max-width: var(--page-max);
  height: 640px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-xl);
  background: var(--card);
  box-shadow: var(--shadow-lg);
}

@media (max-width: 560px) {
  body { padding: 28px 14px 48px; }
  .card { padding: var(--space-4) var(--space-4) var(--space-5); border-radius: var(--radius-lg); }
  .detail-image { height: 216px; }
  .title-row h1 { font-size: 22px; }
  .lineage-map { height: 560px; border-radius: var(--radius-lg); }
}
</style>
</head>
<body>

<div class="card" id="postCard">

  <div class="card-header">
    <a class="back-link" href="family.html" id="backLink">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Back to memories
    </a>
    <div class="menu-wrap">
      <button class="menu-btn" type="button" id="menu-btn" aria-label="More options" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
      </button>
      <div class="menu-dropdown" id="menu-dropdown">
        <button type="button" id="edit-memory-btn" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          Edit memory
        </button>
        <button type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Add to cookbook
        </button>
        <button type="button" class="danger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          Delete memory
        </button>
      </div>
    </div>
  </div>

  <!-- Everything below is populated from the database by app/post.js -->
  <div id="postContent">

    <div class="detail-image-wrap">
      <img class="detail-image" id="detailImage" src="" alt="">
    </div>

    <div class="title-row">
      <h1>
        <span class="title-text" id="titleText">Untitled</span>
        <span class="type-badge" id="typeBadge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3"/><path d="M8 12v9"/><path d="M17 3c-1.5 1.5-2 3-2 5s.5 3 2 4v9"/></svg>
        </span>
      </h1>
      <button class="save-btn" type="button" aria-pressed="false" aria-label="Save this memory" id="save-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
    </div>
    <p class="type-label" id="typeLabel">Memory</p>

    <div class="byline">
      <div class="avatar-photo monogram" id="bylineAvatar" aria-hidden="true">?</div>
      <p class="by-text"><strong id="byName">By someone</strong><span id="byDate">Added recently</span></p>
    </div>

    <p class="description" id="description"></p>

    <div class="ingredients-block" id="ingredientsBlock" hidden>
      <p class="section-label">Ingredients</p>
      <ul class="ingredients-list" id="ingredientsList"></ul>
    </div>

    <div class="steps-block" id="stepsBlock" hidden>
      <p class="section-label">Steps</p>
      <p class="steps-preview" id="steps-preview">
        <span class="step-text" id="stepsPreviewText"></span>
        <button class="view-all" type="button" id="view-all-btn">View all</button>
      </p>
      <ol class="steps-full" id="steps-full"></ol>
    </div>

    <div class="privacy-footer" id="privacy-footer" hidden>
      <button class="privacy-btn" type="button" id="privacy-private" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="1"/><path d="M7 11V8a5 5 0 0 1 10 0v3"/></svg>
        Private to family
      </button>
      <button class="privacy-btn" type="button" id="privacy-public" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.5 3.8 5.6 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3Z"/></svg>
        Share to Community
      </button>
      <a class="extend-btn" id="extend-btn" href="add-memory.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="15" r="2.5"/><path d="M6 8.5v7"/><path d="M6 12h6a3 3 0 0 0 3-3V8.5"/></svg>
        Extend memory
      </a>
    </div>

  </div>

  <div id="postState" hidden></div>

</div>

<!-- The entire map.html (lineage graph + geographic map), embedded below the
     memory. It's a full standalone page, so it lives in its own iframe;
     ?root=<id> points its graph at the memory being viewed. -->
<h2 class="lineage-title">How this memory connects<span>Its lineage across the family, and where it travelled</span></h2>
<iframe class="lineage-map" id="lineageMap" title="Lineage graph and map" loading="lazy"></iframe>
<script>
  (function () {
    var id = new URLSearchParams(window.location.search).get('id');
    document.getElementById('lineageMap').src = 'map.html' + (id ? '?root=' + encodeURIComponent(id) : '');
  })();
</script>

<!-- Load order: Dexie -> db.js -> auth.js -> app/ui.js -> app/data.js -> page controller -->
<script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
<script src="../db.js"></script>
<script src="../seed.js"></script>
<script src="../auth.js"></script>
<script src="../app/ui.js"></script>
<script src="../app/data.js"></script>
<script src="../app/bookmarks.js"></script>
<script src="../app/post.js"></script>
</body>
</html>
