<!--
  map.html — "Roots" map view.

  Renders the SAME lineage tree the community graph shows (via getFullTree from
  db.js), but plotted geographically instead of relationally:
    - one marker per post that has lat/lng set
    - one line per adapted_from edge where both ends have a location

  The plotting itself lives in mapView.js (plotTreeOnMap) so it can be unit
  tested — see test/map.test.html.

  Data: shows the lineage for ?root=<post_id> when given (post.html passes the
  memory being viewed). Opened on its own it falls back to the showcase seed
  (seed.js), which populates the Chen family dumpling lineage the first time.

  Note: Leaflet's map tiles come from OpenStreetMap, so this one view needs
  internet access even though the rest of the app is offline.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Map view</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  :root {
    --ink: #2A251F;
    --muted: #675E4F;
    --meta: #726957;
    --paper: #F4EEE2;
    --surface: #FFFFFF;
    --cream: #EFE7D8;
    --border: #E2DAC8;
    --border-strong: #D4CAB4;
    --forest: #52785B;
    --forest-dark: #3F5E49;
    --clay: #A2794F;
    --font-display: "Playfair Display", Georgia, serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.6;
    letter-spacing: -0.003em;
    margin: 32px;
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    font-family: var(--font-display);
    font-size: 20px; font-weight: 500; letter-spacing: -0.011em;
    margin: 0 0 16px;
  }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--forest); outline-offset: 2px; }

  #view-container {
    position: relative;
    width: 100%;
    height: 470px;
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    background: var(--surface);
    box-shadow: 0 1px 3px rgba(42,37,31,0.06), 0 4px 12px rgba(42,37,31,0.05);
  }

  #graph-view,
  #map-view { position: absolute; inset: 0; }
  #map-view { display: none; }
  #graph-view {
    display: flex; align-items: center; justify-content: center;
    color: var(--meta); font-size: 13px;
  }

  #toggle-view-btn {
    margin-bottom: 12px;
    height: 40px; padding: 0 18px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--ink);
    font-size: 13px; font-weight: 600;
    transition: border-color var(--ease) 150ms, background var(--ease) 150ms;
  }
  #toggle-view-btn:hover { border-color: var(--clay); background: var(--cream); }

  /* Filter bar — only relevant while the map view is showing */
  #map-filters {
    display: none;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .filter-group { display: flex; align-items: center; gap: 8px; }
  .filter-group > span { font-weight: 600; color: var(--muted); }
  #map-filters select {
    height: 34px; padding: 0 30px 0 10px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--ink);
    font-family: inherit; font-size: 13px;
    transition: border-color var(--ease) 150ms, box-shadow var(--ease) 150ms;
  }
  #map-filters select:focus { outline: none; border-color: var(--forest); box-shadow: 0 0 0 3px rgba(82,120,91,0.28); }
  #filter-clear {
    height: 34px; padding: 0 14px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--muted);
    font-size: 12px; font-weight: 600;
    transition: border-color var(--ease) 150ms, background var(--ease) 150ms;
  }
  #filter-clear:hover { border-color: var(--clay); background: var(--cream); }

  /* Multi-select tag chips — mirror the app's filter-chip system */
  .tag-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-chip {
    height: 32px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: inherit; font-size: 13px; font-weight: 500;
    transition: border-color var(--ease) 150ms, background var(--ease) 150ms, color var(--ease) 150ms;
  }
  .tag-chip[aria-pressed="true"] { background: var(--forest); border-color: var(--forest); color: #F8F5EC; }
  .tag-chip:hover { border-color: var(--forest); color: var(--ink); }
  .tag-chips:empty::after { content: "(none)"; color: var(--meta); }

  #status {
    margin-top: 14px;
    font-size: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    white-space: pre-wrap;
    color: var(--meta);
  }

  .leaflet-popup-content { font-family: var(--font-body); font-size: 13px; }
</style>
</head>
<body>

  <h1>Roots — map view</h1>

  <button id="toggle-view-btn">Show map view</button>

  <!-- Two filters for the map dots: one country (single), many tags (multi).
       A dot shows only if it matches the country AND carries EVERY selected tag. -->
  <div id="map-filters">
    <label class="filter-group">Country
      <select id="filter-country"><option value="">All</option></select>
    </label>
    <div class="filter-group">
      <span>Tags</span>
      <div id="filter-tags" class="tag-chips" role="group" aria-label="Filter dots by tag"></div>
    </div>
    <button id="filter-clear" type="button">Clear filters</button>
  </div>

  <div id="view-container">
    <!-- The real vis-network graph lives here in the app; placeholder for now. -->
    <div id="graph-view">(graph view goes here — the vis-network container)</div>
    <div id="map-view"></div>
  </div>

  <div id="status">loading…</div>

  <!-- Leaflet first, then Dexie + our db/geo/mapView modules -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
  <!-- vis-network for graph rendering -->
  <link rel="stylesheet" href="https://unpkg.com/vis-network/styles/vis-network.css" />
  <script src="https://unpkg.com/vis-network/dist/vis-network.min.js"></script>
  <script src="../treeToHtml.js"></script>
  <script src="../geo.js"></script>
  <script src="../db.js"></script>
  <script src="../seed.js"></script>
  <script src="../mapView.js"></script>

  <script>
    // The Leaflet map instance and the layers we've drawn, so we can clear
    // them before every redraw (otherwise layers just stack up).
    let map = null;
    let drawnLayers = [];

    // Set up the Leaflet map once, the first time the map view is opened.
    function initMap() {
      if (map) return;
      map = L.map("map-view").setView([20, 0], 2);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);
    }

    function clearMap() {
      drawnLayers.forEach((layer) => map.removeLayer(layer));
      drawnLayers = [];
    }

    // The full (unfiltered) tree currently loaded, so the filters can be
    // re-applied without re-querying the database.
    let currentTree = { nodes: [], edges: [] };

    const countrySelect = document.getElementById("filter-country");
    const tagChips = document.getElementById("filter-tags");
    const clearFiltersBtn = document.getElementById("filter-clear");

    // Currently pressed tags, as a Set — the map shows only dots that carry
    // EVERY one of them (AND).
    const selectedTags = new Set();

    // Rebuild the country <select> and the tag chip row from whatever countries
    // and tags exist in `tree`. Selections that still exist are kept.
    function populateFilters(tree) {
      // Country: single-select dropdown
      const countries = distinctCountries(tree); // helpers from mapView.js
      const previousCountry = countrySelect.value;
      countrySelect.innerHTML = '<option value="">All</option>';
      for (const c of countries) {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        countrySelect.appendChild(opt);
      }
      countrySelect.value = countries.includes(previousCountry) ? previousCountry : "";

      // Tags: multi-select chips (like the family page's filter chips)
      const tags = distinctTags(tree);
      // Drop any selected tag that no longer exists in this tree.
      for (const t of [...selectedTags]) {
        if (!tags.includes(t)) selectedTags.delete(t);
      }
      tagChips.innerHTML = "";
      for (const t of tags) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "tag-chip";
        chip.dataset.tag = t;
        chip.textContent = t;
        chip.setAttribute("aria-pressed", String(selectedTags.has(t)));
        tagChips.appendChild(chip);
      }
    }

    // Draw the map using the current tree filtered by the current selections.
    function applyFiltersAndRender() {
      initMap();
      map.invalidateSize(); // container may have just been un-hidden
      clearMap();

      const filters = { country: countrySelect.value, tags: [...selectedTags] };
      const shown = filterTree(currentTree, filters); // filtering lives in mapView.js
      const result = plotTreeOnMap(map, shown);
      drawnLayers = result.layers;

      const points = shown.nodes
        .filter((p) => p.lat != null && p.lng != null)
        .map((p) => [p.lat, p.lng]);
      if (points.length) map.fitBounds(points, { padding: [40, 40], maxZoom: 5 });

      const parts = [];
      if (filters.country) parts.push(`country = ${filters.country}`);
      if (filters.tags.length) parts.push(`tags = ${filters.tags.join(" + ")}`);
      statusEl.textContent =
        `Filter: ${parts.length ? parts.join(", ") : "no filter"}\n` +
        `Plotted: ${result.markers} markers, ${result.lines} lines.\n` +
        `Hidden: ${currentTree.nodes.length - shown.nodes.length} post(s) by filter, ` +
        `${result.skipped} with no location.`;

      return result;
    }

    // Pull the SAME tree the graph view uses, then plot it geographically.
    async function renderMapView(rootPostId) {
      currentTree = await getFullTree(rootPostId); // { nodes, edges } — reused from db.js
      populateFilters(currentTree);
      return applyFiltersAndRender();
    }

    countrySelect.addEventListener("change", applyFiltersAndRender);

    // One click handler for every tag chip (they're recreated on each load).
    tagChips.addEventListener("click", (e) => {
      const chip = e.target.closest(".tag-chip");
      if (!chip) return;
      const tag = chip.dataset.tag;
      if (selectedTags.has(tag)) selectedTags.delete(tag);
      else selectedTags.add(tag);
      chip.setAttribute("aria-pressed", String(selectedTags.has(tag)));
      applyFiltersAndRender();
    });

    clearFiltersBtn.addEventListener("click", () => {
      countrySelect.value = "";
      selectedTags.clear();
      tagChips.querySelectorAll(".tag-chip").forEach((c) => c.setAttribute("aria-pressed", "false"));
      applyFiltersAndRender();
    });

    // ---------- Toggle + boot ----------

    const toggleBtn = document.getElementById("toggle-view-btn");
    const graphView = document.getElementById("graph-view");
    const mapView = document.getElementById("map-view");
    const statusEl = document.getElementById("status");
    let showingMap = false;
    let demoRootId = null;

    // Resolve which post's lineage to show:
    //   1. ?root=<post_id> on the URL (post.html passes the memory being viewed)
    //   2. the showcase seed's root (seeds the demo data if the archive is empty)
    //   3. otherwise the first published / any post
    async function resolveRootId() {
      const requested = Number(new URLSearchParams(location.search).get("root"));
      if (requested && (await db.posts.get(requested))) return requested;

      if (window.showcaseSeed) {
        const r = await window.showcaseSeed.ensure();
        if (r && r.rootPostId) return r.rootPostId;
      }

      const published = await getPublishedPosts();
      if (published.length) return published[0].post_id;
      const any = await db.posts.toCollection().first();
      return any ? any.post_id : null;
    }

    async function boot() {
      demoRootId = await resolveRootId();
      if (demoRootId == null) {
        statusEl.textContent = "No memories to map yet.";
        return;
      }
      // Render the graph view for the resolved lineage
      try { await renderGraphView(demoRootId); } catch (e) { console.warn('initial renderGraphView failed', e); }
    }

    const filterBar = document.getElementById("map-filters");

    toggleBtn.addEventListener("click", async () => {
      showingMap = !showingMap;
      graphView.style.display = showingMap ? "none" : "flex";
      mapView.style.display = showingMap ? "block" : "none";
      filterBar.style.display = showingMap ? "flex" : "none";
      toggleBtn.textContent = showingMap ? "Show graph view" : "Show map view";

      if (showingMap) {
        await renderMapView(demoRootId); // sets the status line itself
      } else {
        await renderGraphView(demoRootId);
      }
    });
    async function renderGraphView(rootId) {
      try {
        const tree = await getFullTree(rootId);
        // renderTreeAsHtml returns the vis container + embedded JSON
        graphView.innerHTML = renderTreeAsHtml(tree);
        // attempt to enhance (initialise vis) — works if vis loaded
        if (typeof window.enhanceGraph === 'function') {
          try { window.enhanceGraph(graphView); } catch (e) { console.warn('enhanceGraph error', e); }
        }
        statusEl.textContent = `Graph: ${tree.nodes.length} nodes, ${tree.edges.length} edges.`;
      } catch (e) {
        console.warn('renderGraphView failed', e);
        statusEl.textContent = 'Failed to render graph view';
      }
    }

    boot();
  </script>

</body>
</html>
