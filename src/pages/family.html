<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corner Stone — My Family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="app-shell">

  <aside class="app-sidebar">
    <div>
      <div class="sidebar-logo">
        Corner Stone
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V13"/><path d="M12 13c0-4 3-6 7-6-1 4-3 6-7 6Z"/><path d="M12 13c0-3-2.5-5-6-5 .8 3 2.5 5 6 5Z"/></svg>
      </div>
      <nav class="sidebar-nav" aria-label="Primary">
        <a href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          Home
        </a>
        <a href="family.html" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><circle cx="18" cy="8" r="2.4"/><path d="M16 21c0-2.8 1.6-4.8 4-5.6"/></svg>
          My Family
        </a>
        <a href="add-memory.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Memory
        </a>
        <a href="community.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.5 3.8 5.6 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3Z"/></svg>
          Community
        </a>
        <a href="saved.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4.5 8-11.2V5l-8-3-8 3v5.8C4 17.5 12 22 12 22Z"/></svg>
          Saved
        </a>
      </nav>
    </div>
    <nav class="sidebar-nav">
      <a href="#" aria-disabled="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1Z"/></svg>
        Settings
      </a>
    </nav>
  </aside>

  <div class="app-main">

    <header class="app-topbar">
      <button class="family-switch" type="button">
        <span id="familyName">Your family</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="topbar-right">
        <div class="topbar-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="search" placeholder="Search family board..." aria-label="Search family board">
        </div>
        <button class="icon-btn" type="button" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
        <div class="avatar-monogram" id="avatarMonogram" role="img" aria-label="Profile">&nbsp;</div>
      </div>
    </header>

    <main class="app-content">

      <div class="family-header">
        <div>
          <h1 id="familyHeading">Your family</h1>
          <p class="tagline">Preserving our story, one memory at a time.</p>
          <p class="stats" id="familyStats">Loading&hellip;</p>
        </div>
        <div class="family-header-actions">
          <button class="btn btn-secondary" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>
            Invite Family
          </button>
          <a class="btn btn-primary" href="add-memory.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Memory
          </a>
        </div>
      </div>

      <div class="members-row" id="membersRow" aria-label="Family members"></div>

      <div class="filter-row" role="group" aria-label="Filter family posts by category">
        <button class="filter-chip" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-chip" type="button" data-filter="recipe" aria-pressed="false">Recipes</button>
        <button class="filter-chip" type="button" data-filter="story" aria-pressed="false">Stories</button>
        <button class="filter-chip" type="button" data-filter="tradition" aria-pressed="false">Traditions</button>
        <button class="filter-chip" type="button" data-filter="memory" aria-pressed="false">Memories</button>
        <button class="filter-chip" type="button" data-filter="history" aria-pressed="false">Family History</button>

        <!-- Public custom cultures — searchable dropdown, populated by family.js -->
        <div class="tag-filter" id="cultureFilter" hidden>
          <button class="filter-chip tag-filter-toggle" type="button" id="cultureFilterToggle"
                  aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.5 3.8 5.6 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3Z"/></svg>
            <span id="cultureFilterLabel">Custom cultures</span>
            <svg class="tag-filter-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="tag-filter-panel" id="cultureFilterPanel" hidden>
            <input type="search" class="tag-filter-search" id="cultureFilterSearch"
                   placeholder="Search cultures…" autocomplete="off" aria-label="Search custom cultures">
            <div class="tag-filter-list" id="cultureFilterList" role="listbox"></div>
          </div>
        </div>

        <!-- Public custom tags — searchable dropdown, populated by family.js -->
        <div class="tag-filter" id="tagFilter" hidden>
          <button class="filter-chip tag-filter-toggle" type="button" id="tagFilterToggle"
                  aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 12 22l-8-8V4h10l6.6 6.6a2 2 0 0 1 0 2.8Z"/><circle cx="8.5" cy="8.5" r="1.2"/></svg>
            <span id="tagFilterLabel">Custom tags</span>
            <svg class="tag-filter-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="tag-filter-panel" id="tagFilterPanel" hidden>
            <input type="search" class="tag-filter-search" id="tagFilterSearch"
                   placeholder="Search tags…" autocomplete="off" aria-label="Search custom tags">
            <div class="tag-filter-list" id="tagFilterList" role="listbox"></div>
          </div>
        </div>
      </div>

      <div id="familyGrid" class="family-post-grid">
        <p class="loading-line">Loading your family board&hellip;</p>
      </div>

    </main>
  </div>
</div>

<!-- Load order: Dexie -> db.js -> app/ui.js -> app/data.js -> page controller -->
<script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
<script src="../db.js"></script>
<script src="../seed.js"></script>
<script src="../app/ui.js"></script>
<script src="../app/data.js"></script>
<script src="../app/family.js"></script>
</body>
</html>
