      <nav class="sidebar-nav" aria-label="Primary">
        <a href="index.html">

        <a href="family.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><circle cx="18" cy="8" r="2.4"/><path d="M16 21c0-2.8 1.6-4.8 4-5.6"/></svg>

        <a href="community.html" aria-current="page">

          Community

        <a href="saved.html">

        Settings
      </a>
    </nav>
  </aside>

  <div class="app-main">
    <main class="app-content">

      <div class="archive-header">
        <div>
          <h1>Community Archive</h1>
          <p>Explore and learn from families around the world.</p>
        </div>
        <div class="header-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="search" id="search-input" placeholder="Search the archive..." aria-label="Search the archive">
        </div>
      </div>

      <nav class="culture-nav" aria-label="Filter by culture">
        <ul class="culture-list" id="culture-list"></ul>
      </nav>

      <div class="archive-layout">

        <aside class="category-sidebar" aria-label="Filter by category">
          <ul class="category-list" id="category-list"></ul>
        </aside>

        <section class="archive-content">

          <div class="section-title-row">
            <h2 id="section-title">All Contributions</h2>
            <svg class="section-underline" viewBox="0 0 92 8" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M1 5.5C15 2 30 1 45 3.5C60 6 75 4.5 91 2" stroke="#CBB89A" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <p class="meta" id="section-meta"></p>
          </div>

          <article class="featured-memory" id="featured-memory" hidden></article>

          <section class="post-grid" id="post-grid" aria-label="Archive posts"></section>

          <div class="empty-state" id="empty-state" hidden>
            <h3>Nothing here yet</h3>
            <p>Try a different culture, category, or search term.</p>
          </div>

          <div class="load-more-row" id="load-more-row" hidden>
            <button class="load-more-btn" type="button" id="load-more-btn">
              Load more
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
          </div>

        </section>

      </div>

    </main>
  </div>
</div>

<!-- Load order: Dexie -> db.js -> app/ui.js -> app/data.js -> page controller -->
<script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
